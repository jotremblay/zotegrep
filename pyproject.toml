[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zotegrep"
dynamic = ["version"]
description = "Full-text search inside every PDF of your Zotero library: phrases, NEAR, regex, page numbers. Command line and local web interface."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Marc Pinet" }]
keywords = ["zotero", "pdf", "full-text search", "grep", "research", "literature review", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    # PyMuPDF 2 pulls onnxruntime, numpy and networkx (over 100 MB) for layout
    # analysis ZoteGrep does not use; 1.x has everything it needs.
    "PyMuPDF>=1.24,<2",
    "pyzotero>=1.10",
    "regex>=2024.4.16",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zotegrep = "zotegrep.cli:main"

[project.urls]
Homepage = "https://github.com/marcpinet/zotegrep"
Issues = "https://github.com/marcpinet/zotegrep/issues"

[tool.hatch.version]
path = "src/zotegrep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zotegrep"]

[tool.hatch.build.targets.sdist]
include = ["src/zotegrep", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
