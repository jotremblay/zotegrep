# Release on every new version: when the version in src/zotegrep/__init__.py
# has no vX.Y.Z tag yet, build, test the built wheel, publish it to PyPI, then
# tag the commit and create the GitHub release with the same files.

name: PyPI

on:
  push:
    branches: [main]
    paths: ["src/zotegrep/__init__.py"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/zotegrep/__init__.py').read_text()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new: releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test the package
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the built wheel, not the source tree
        run: |
          python -m pip install dist/*.whl pytest
          python -m pytest -q
          zotegrep --version | grep -x "zotegrep ${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_KEY }}
          skip-existing: true

  github-release:
    name: Tag and GitHub release
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
